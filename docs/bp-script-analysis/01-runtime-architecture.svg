<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint bp 脚本运行架构</title>
  <desc id="desc">从母版 bootstrap、项目内 bp CLI、命令、运行时和领域库到项目事实与生成 skill 的分层架构图。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#dbeafe;stroke:#3b82f6}.violet{fill:#ede9fe;stroke:#8b5cf6}.green{fill:#dcfce7;stroke:#22c55e}.amber{fill:#fef3c7;stroke:#f59e0b}.rose{fill:#ffe4e6;stroke:#f43f5e}.gray{fill:#f1f5f9;stroke:#64748b}.box{stroke-width:2;rx:14}.t{font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.h{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.s{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.xs{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <text class="h" x="56" y="58">bp 的两套入口与五层运行架构</text>
  <text class="s" x="56" y="88">母版安装入口只部署；项目内 CLI 只做日常确定性判断。二者刻意隔离。</text>

  <rect class="box amber" x="55" y="130" width="295" height="170"/>
  <text class="t" x="80" y="170">母版入口</text>
  <text class="xs" x="80" y="202">assets/bootstrap.mjs</text>
  <text class="s" x="80" y="235">解析 init 参数</text>
  <text class="s" x="80" y="263">仅用 Node 内置模块读取母版资产</text>
  <text class="s" x="80" y="289">复制运行时、模板、六个 skill</text>

  <rect class="box blue" x="430" y="130" width="300" height="170"/>
  <text class="t" x="455" y="170">项目内 CLI</text>
  <text class="xs" x="455" y="202">blueprint/scripts/bp.mjs</text>
  <text class="s" x="455" y="235">createCli → dispatch</text>
  <text class="s" x="455" y="263">拒绝 init；统一错误出口</text>
  <text class="s" x="455" y="289">只路由，不承载业务判断</text>

  <rect class="box violet" x="810" y="130" width="570" height="170"/>
  <text class="t" x="835" y="170">生成的六个项目 skill</text>
  <text class="s" x="835" y="206">pipeline：调度 stage</text>
  <text class="s" x="835" y="235">flow / activity / domain：语义设计 + 人工确认</text>
  <text class="s" x="835" y="264">code：实现 + codemap + verify</text>
  <text class="s" x="835" y="293">commit：组装上下文与提交信息</text>

  <path class="arrow" d="M350 215H425"/>
  <path class="arrow" d="M810 215H735"/>
  <text class="s" x="354" y="199">部署</text>
  <text class="s" x="748" y="199">调用 BP</text>

  <rect class="panel" x="55" y="350" width="1325" height="490" rx="18"/>
  <text class="t" x="80" y="390">项目内 bp.mjs 的内部层次</text>

  <rect class="box blue" x="85" y="425" width="250" height="340"/>
  <text class="t" x="110" y="466">commands/</text>
  <text class="s" x="110" y="500">stage / scan / status</text>
  <text class="s" x="110" y="529">flow/activity/domain approve</text>
  <text class="s" x="110" y="558">review / code / schema</text>
  <text class="s" x="110" y="587">scope / read / validate</text>
  <text class="s" x="110" y="616">commit / delete / help</text>
  <text class="s" x="110" y="658">职责：</text>
  <text class="s" x="110" y="686">编排一次命令</text>
  <text class="s" x="110" y="714">校验门 + 输出 + 写锁</text>

  <rect class="box violet" x="405" y="425" width="250" height="340"/>
  <text class="t" x="430" y="466">runtime/</text>
  <text class="s" x="430" y="500">cli：参数与错误出口</text>
  <text class="s" x="430" y="529">context：root/config/repo</text>
  <text class="s" x="430" y="558">entities：对象存在性</text>
  <text class="s" x="430" y="587">reviews：澄清门</text>
  <text class="s" x="430" y="616">verify：实现预检与编译</text>
  <text class="s" x="430" y="658">职责：</text>
  <text class="s" x="430" y="686">命令共享的执行外壳</text>

  <rect class="box green" x="725" y="425" width="270" height="340"/>
  <text class="t" x="750" y="466">lib/</text>
  <text class="s" x="750" y="500">repo：事实模型</text>
  <text class="s" x="750" y="529">stage：状态算法</text>
  <text class="s" x="750" y="558">schema：结构/引用校验</text>
  <text class="s" x="750" y="587">hash：规范化哈希</text>
  <text class="s" x="750" y="616">db / codemap / review</text>
  <text class="s" x="750" y="658">职责：</text>
  <text class="s" x="750" y="686">纯规则与文件模型</text>
  <text class="s" x="750" y="714">确定性判断的核心</text>

  <rect class="box gray" x="1065" y="425" width="280" height="340"/>
  <text class="t" x="1090" y="466">项目事实</text>
  <text class="s" x="1090" y="500">product / spec / domain</text>
  <text class="s" x="1090" y="529">templates / config.yaml</text>
  <text class="s" x="1090" y="558">lock.json / *.review.md</text>
  <text class="s" x="1090" y="587">snapshot / todo / codemap</text>
  <text class="s" x="1090" y="616">代码文件 + git 状态</text>
  <text class="s" x="1090" y="658">特点：</text>
  <text class="s" x="1090" y="686">每次命令重新装载</text>
  <text class="s" x="1090" y="714">无常驻进程状态</text>

  <path class="arrow" d="M335 595H400"/>
  <path class="arrow" d="M655 595H720"/>
  <path class="arrow" d="M995 595H1060"/>
  <text class="s" x="83" y="813">结论：bp 是“文件系统 + lock 的可重放状态计算器”，不是工作流引擎服务，也不是业务语义推理器。</text>
</svg>
