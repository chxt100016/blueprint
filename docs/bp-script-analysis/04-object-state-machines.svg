<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1160" viewBox="0 0 1560 1160" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint 各层对象状态机</title><desc id="desc">flow、activity、domain 与 code 四层的状态判定条件。</desc>
  <defs><style>.bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.todo{fill:#dbeafe;stroke:#3b82f6}.review{fill:#fef3c7;stroke:#f59e0b}.approve{fill:#ede9fe;stroke:#8b5cf6}.done{fill:#dcfce7;stroke:#22c55e}.blocked{fill:#ffe4e6;stroke:#f43f5e}.waiting{fill:#f1f5f9;stroke:#64748b}.box{stroke-width:2;rx:12}.h{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.t{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.m{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1560" height="1160"/><text class="h" x="52" y="58">四层对象状态机：同名状态，不同判据</text><text class="s" x="52" y="88">核心技巧：比较“当前文档哈希”与 lock 中的上游/本层哈希，区分尚未跟进与已更新待确认。</text>

  <rect class="panel" x="45" y="125" width="720" height="430"/><text class="t" x="75" y="165">Flow / 业务服务</text>
  <text class="s" x="75" y="198">输入：product anchor hash、flow hash、lock.services[id].flow、flow.review.md</text>
  <rect class="box todo" x="75" y="235" width="180" height="90"/><text class="m" x="132" y="270">todo</text><text class="s" x="94" y="298">无 flow；或上游变了</text><text class="s" x="94" y="318">而 flow 仍等于锁定版</text>
  <rect class="box review" x="300" y="235" width="180" height="90"/><text class="m" x="354" y="270">review</text><text class="s" x="319" y="298">product/flow 有变化</text><text class="s" x="319" y="318">且澄清未结清</text>
  <rect class="box approve" x="525" y="235" width="180" height="90"/><text class="m" x="573" y="270">approve</text><text class="s" x="544" y="298">内容已有变化</text><text class="s" x="544" y="318">澄清已结清，等人</text>
  <rect class="box done" x="300" y="400" width="180" height="90"/><text class="m" x="357" y="436">done</text><text class="s" x="320" y="465">product_hash 与</text><text class="s" x="320" y="485">flow_hash 均匹配锁</text>
  <path class="arrow" d="M255 280H295"/><path class="arrow" d="M480 280H520"/><path class="arrow" d="M615 325V370H480V395"/>
  <text class="s" x="75" y="525">approve 写锁：product_hash + flow_hash + approved_at</text>

  <rect class="panel" x="795" y="125" width="720" height="430"/><text class="t" x="825" y="165">Activity / 业务服务的一组活动</text>
  <text class="s" x="825" y="198">前置：flow 已 approve。输入：flow hash、每个 activity hash、目录、review。</text>
  <rect class="box todo" x="825" y="235" width="180" height="90"/><text class="m" x="882" y="270">todo</text><text class="s" x="844" y="298">活动文档缺失；或 flow</text><text class="s" x="844" y="318">变了而活动尚未变</text>
  <rect class="box review" x="1050" y="235" width="180" height="90"/><text class="m" x="1104" y="270">review</text><text class="s" x="1069" y="298">flow/活动有变化</text><text class="s" x="1069" y="318">且任一活动澄清未结</text>
  <rect class="box approve" x="1275" y="235" width="180" height="90"/><text class="m" x="1323" y="270">approve</text><text class="s" x="1294" y="298">活动已更新、澄清结清</text><text class="s" x="1294" y="318">等待按服务整体确认</text>
  <rect class="box done" x="1050" y="400" width="180" height="90"/><text class="m" x="1107" y="436">done</text><text class="s" x="1069" y="465">flow hash 与全部</text><text class="s" x="1069" y="485">activity hash 匹配锁</text>
  <path class="arrow" d="M1005 280H1045"/><path class="arrow" d="M1230 280H1270"/><path class="arrow" d="M1365 325V370H1230V395"/>
  <text class="s" x="825" y="525">approve 写锁：service.activity.flow_hash + 每个 activities[id].spec.activity_hash</text>

  <rect class="panel" x="45" y="585" width="720" height="500"/><text class="t" x="75" y="625">Domain / 领域能力</text>
  <text class="s" x="75" y="658">输入：activity.uses 反向索引、domain 文档 hash、domain.review.md、contract_fields。</text>
  <rect class="box todo" x="75" y="700" width="180" height="90"/><text class="m" x="132" y="735">todo</text><text class="s" x="94" y="763">uses 已登记</text><text class="s" x="94" y="783">但 domain.md 不存在</text>
  <rect class="box review" x="300" y="700" width="180" height="90"/><text class="m" x="354" y="735">review</text><text class="s" x="319" y="763">文档未锁定/已变化</text><text class="s" x="319" y="783">且澄清未结清</text>
  <rect class="box approve" x="525" y="700" width="180" height="90"/><text class="m" x="573" y="735">approve</text><text class="s" x="544" y="763">hash 不匹配</text><text class="s" x="544" y="783">澄清已结清，等人</text>
  <rect class="box done" x="300" y="870" width="180" height="90"/><text class="m" x="357" y="906">done</text><text class="s" x="319" y="934">domain_hash</text><text class="s" x="319" y="954">匹配 lock.spec</text>
  <path class="arrow" d="M255 745H295"/><path class="arrow" d="M480 745H520"/><path class="arrow" d="M615 790V840H480V865"/>
  <text class="s" x="75" y="1000">approve 额外守门：契约第一列字段只增不改。</text><text class="s" x="75" y="1028">无 usedBy 的现有 domain 不进本层，而进 orphaned。</text>

  <rect class="panel" x="795" y="585" width="720" height="500"/><text class="t" x="825" y="625">Code / 已批准活动与领域能力</text>
  <text class="s" x="825" y="658">输入：spec hash、impl hash、todo、snapshot gap、uses、codemap、verify。</text>
  <rect class="box blocked" x="825" y="700" width="190" height="95"/><text class="m" x="882" y="736">blocked</text><text class="s" x="846" y="765">相关 todo 存在</text><text class="s" x="846" y="785">或表/列在 snapshot 缺失</text>
  <rect class="box waiting" x="1040" y="700" width="190" height="95"/><text class="m" x="1097" y="736">waiting</text><text class="s" x="1061" y="765">活动 uses 的 domain</text><text class="s" x="1061" y="785">尚无文档</text>
  <rect class="box todo" x="1255" y="700" width="190" height="95"/><text class="m" x="1321" y="736">todo</text><text class="s" x="1276" y="765">无 impl；或 impl hash</text><text class="s" x="1276" y="785">落后于已批 spec</text>
  <rect class="box done" x="1040" y="870" width="190" height="95"/><text class="m" x="1107" y="906">done</text><text class="s" x="1061" y="935">impl 中的 spec hash</text><text class="s" x="1061" y="955">等于当前锁定 spec</text>
  <path class="arrow" d="M1350 795V840H1230V865"/>
  <text class="s" x="825" y="1000">code done：validate → 已 approve 且文档未漂移 → codemap 文件存在 → verify。</text>
  <text class="s" x="825" y="1028">通过后写 impl；不保存代码 hash，代码外部修改由 git 负责。</text>
  <text class="s" x="52" y="1130">review 与 approve 可多轮往返；只有 approve/code done/adopt 会写 lock，从而提供下一次 scan 的终止条件。</text>
</svg>
