<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1050" viewBox="0 0 1680 1050" role="img" aria-labelledby="title desc">
  <title id="title">六个 skill 与 bp 命令调用地图</title><desc id="desc">pipeline、flow、activity、domain、code、commit skill 调用的命令以及内部主要模块。</desc>
  <defs><style>.bg{fill:#f8fafc}.skill{fill:#ede9fe;stroke:#8b5cf6;stroke-width:2;rx:14}.cmd{fill:#dbeafe;stroke:#3b82f6;stroke-width:2;rx:11}.lib{fill:#dcfce7;stroke:#22c55e;stroke-width:2;rx:11}.human{fill:#fef3c7;stroke:#f59e0b;stroke-width:2;rx:11}.h{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.t{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.xs{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1680" height="1050"/><text class="h" x="50" y="58">调用地图：skill 是操作规程，bp command 是确定性执行点</text><text class="s" x="50" y="88">粗粒度看“谁调用谁”；具体规则最终落在 lib/stage、lib/schema、runtime/reviews、runtime/verify。</text>

  <text class="t" x="70" y="135">生成 skill</text><text class="t" x="420" y="135">主要 BP 命令</text><text class="t" x="1120" y="135">内部判断/副作用</text>

  <rect class="skill" x="55" y="165" width="260" height="115"/><text class="t" x="80" y="205">pipeline-&lt;project&gt;</text><text class="s" x="80" y="235">全局调度，不写文档</text><text class="s" x="80" y="260">stage 不变即停止</text>
  <rect class="cmd" x="400" y="165" width="285" height="115"/><text class="t" x="425" y="205">stage / delete plan</text><text class="xs" x="425" y="235">commands/stage.mjs</text><text class="xs" x="425" y="258">commands/delete/plan.mjs</text>
  <rect class="lib" x="1110" y="165" width="510" height="115"/><text class="t" x="1135" y="205">globalStage → scanOrphans/Flow/Activity/Domain/Code</text><text class="s" x="1135" y="235">按优先级选择 stage；orphaned 时生成 todo 清理单</text>
  <path class="arrow" d="M315 222H395"/><path class="arrow" d="M685 222H1105"/>

  <rect class="skill" x="55" y="315" width="260" height="115"/><text class="t" x="80" y="355">flow-&lt;project&gt;</text><text class="s" x="80" y="385">流程/活动划分</text><text class="s" x="80" y="410">第一道人工确认门</text>
  <rect class="cmd" x="400" y="300" width="620" height="145"/><text class="t" x="425" y="337">scan flow · read · validate · review ask/answer/resolve</text><text class="t" x="425" y="370">flow changes · flow approve</text><text class="xs" x="425" y="405">commands/flow/* + commands/review/*</text>
  <rect class="lib" x="1110" y="300" width="510" height="145"/><text class="t" x="1135" y="337">scanFlow + validateService + requireCleanReviews</text><text class="s" x="1135" y="370">approve 写 product_hash / flow_hash；删除 flow.review.md</text><text class="s" x="1135" y="402">语义边界由 skill 判断，脚本只守结构不变量</text>
  <path class="arrow" d="M315 372H395"/><path class="arrow" d="M1020 372H1105"/>

  <rect class="skill" x="55" y="480" width="260" height="125"/><text class="t" x="80" y="520">activity-&lt;project&gt;</text><text class="s" x="80" y="550">活动契约 + uses 登记</text><text class="s" x="80" y="577">第二道人工确认门</text>
  <rect class="cmd" x="400" y="465" width="620" height="155"/><text class="t" x="425" y="502">scan activity · schema pull/check · read · validate</text><text class="t" x="425" y="535">domain list/reject · review 三步</text><text class="t" x="425" y="568">activity changes · activity approve</text><text class="xs" x="425" y="598">commands/activity/* + schema/* + domain/*</text>
  <rect class="lib" x="1110" y="465" width="510" height="155"/><text class="t" x="1135" y="502">scanActivity + validateActivity + DB snapshot</text><text class="s" x="1135" y="535">approve 按服务一次锁定全部 activity_hash</text><text class="s" x="1135" y="568">同时锁定本次 flow_hash；缺失 uses 进入 domain.todo</text>
  <path class="arrow" d="M315 542H395"/><path class="arrow" d="M1020 542H1105"/>

  <rect class="skill" x="55" y="645" width="260" height="125"/><text class="t" x="80" y="685">domain-&lt;project&gt;</text><text class="s" x="80" y="715">领域契约并集</text><text class="s" x="80" y="742">第三道人工确认门</text>
  <rect class="cmd" x="400" y="640" width="620" height="135"/><text class="t" x="425" y="678">scan/list/changes/approve/reject · validate · review 三步</text><text class="xs" x="425" y="714">commands/domain/* + commands/review/*</text><text class="s" x="425" y="747">读取全部 activity.uses 的反向引用</text>
  <rect class="lib" x="1110" y="640" width="510" height="135"/><text class="t" x="1135" y="678">scanDomain + validateDomain</text><text class="s" x="1135" y="711">approve 锁 domain_hash + contract_fields</text><text class="s" x="1135" y="743">后续删除/改名契约字段会被拒绝</text>
  <path class="arrow" d="M315 707H395"/><path class="arrow" d="M1020 707H1105"/>

  <rect class="skill" x="55" y="810" width="260" height="125"/><text class="t" x="80" y="850">code-&lt;project&gt;</text><text class="s" x="80" y="880">代码 + codemap</text><text class="s" x="80" y="907">无人工 approve</text>
  <rect class="cmd" x="400" y="800" width="620" height="145"/><text class="t" x="425" y="838">scan code · scope/read · code check/done</text><text class="t" x="425" y="871">存量接入：code adopt [id|--all]</text><text class="xs" x="425" y="907">commands/code/* + commands/scope.mjs</text>
  <rect class="lib" x="1110" y="800" width="510" height="145"/><text class="t" x="1135" y="838">implPrecheck → validate + spec hash + codemap</text><text class="s" x="1135" y="871">runVerify 按 scope 执行 config.verify</text><text class="s" x="1135" y="903">done/adopt 写 impl hash、files、时间、base_commit</text>
  <path class="arrow" d="M315 872H395"/><path class="arrow" d="M1020 872H1105"/>

  <rect class="skill" x="55" y="970" width="260" height="60"/><text class="t" x="80" y="1007">commit-&lt;project&gt;</text>
  <rect class="cmd" x="400" y="970" width="620" height="60"/><text class="t" x="425" y="1007">commit context → commit message → 人确认 → git add/commit</text>
  <rect class="human" x="1110" y="970" width="510" height="60"/><text class="t" x="1135" y="1007">buildCommitContext + git 状态；真正 commit 由 skill 执行</text>
  <path class="arrow" d="M315 1000H395"/><path class="arrow" d="M1020 1000H1105"/>
</svg>
