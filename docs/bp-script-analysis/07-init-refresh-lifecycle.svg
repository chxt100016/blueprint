<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint 初始化与刷新生命周期</title><desc id="desc">bootstrap 安装生成物与定制物的覆盖和保留行为。</desc>
  <defs><style>.bg{fill:#f8fafc}.master{fill:#fef3c7;stroke:#f59e0b;stroke-width:2;rx:14}.gen{fill:#dbeafe;stroke:#3b82f6;stroke-width:2;rx:14}.custom{fill:#dcfce7;stroke:#22c55e;stroke-width:2;rx:14}.danger{fill:#ffe4e6;stroke:#f43f5e;stroke-width:2;rx:14}.h{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.t{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.s{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.xs{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}.overwrite{stroke:#f43f5e;stroke-width:3;fill:none;marker-end:url(#r)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f43f5e"/></marker></defs>
  <rect class="bg" width="1500" height="880"/><text class="h" x="55" y="58">init / refresh：同一条 bootstrap 命令，两种文件所有权</text><text class="s" x="55" y="88">幂等的准确含义：生成物总覆盖，定制物存在即保留；不是整个 blueprint 目录都幂等覆盖。</text>
  <rect class="master" x="55" y="145" width="360" height="225"/><text class="t" x="85" y="187">skill 母版 assets/</text><text class="xs" x="85" y="222">bootstrap.mjs</text><text class="xs" x="85" y="248">scripts/ · templates/{type}/</text><text class="xs" x="85" y="274">skills/{pipeline..commit}.md</text><text class="xs" x="85" y="300">config/{type}.yaml</text><text class="s" x="85" y="337">bp-assets.json 用来证明入口来自母版</text>
  <rect class="master" x="520" y="160" width="430" height="190"/><text class="t" x="550" y="202">独立单文件 bootstrap</text><text class="s" x="550" y="238">仅依赖 Node 内置模块和同级母版资产</text><text class="s" x="550" y="270">覆盖生成物；按“若不存在”补定制骨架</text><text class="s" x="550" y="302">追加 .gitignore；创建空目录</text>
  <path class="arrow" d="M415 257H515"/>

  <rect class="gen" x="1030" y="120" width="415" height="270"/><text class="t" x="1060" y="162">生成物：每次无条件覆盖</text><text class="xs" x="1060" y="198">blueprint/scripts/</text><text class="xs" x="1060" y="224">blueprint/templates/</text><text class="xs" x="1060" y="250">blueprint/WORKFLOW.md</text><text class="xs" x="1060" y="276">.claude/skills/*-&lt;project&gt;/SKILL.md</text><text class="s" x="1060" y="316">项目运行时源码不含任何安装模块</text><text class="s" x="1060" y="345">刷新时只清理早期版本的已知残留</text>
  <path class="overwrite" d="M950 220H1025"/>

  <rect class="custom" x="300" y="490" width="500" height="280"/><text class="t" x="330" y="532">定制物：存在就原样保留</text><text class="xs" x="330" y="568">blueprint/config.yaml</text><text class="xs" x="330" y="594">blueprint/lock.json</text><text class="xs" x="330" y="620">blueprint/CONVENTIONS.md</text><text class="xs" x="330" y="646">blueprint/context/ · product/ · spec/</text><text class="xs" x="330" y="672">domain/ · codemap/ · snapshot/ · todo/</text><text class="s" x="330" y="710">刷新不会补 config 新字段，也不迁移 lock 版本</text><text class="s" x="330" y="738">这部分由人负责维护与迁移</text>
  <path class="arrow" d="M735 350V485"/>

  <rect class="danger" x="875" y="490" width="570" height="280"/><text class="t" x="905" y="532">刷新最值得警惕的连锁反应</text><text class="s" x="905" y="571">1. templates 整目录覆盖，项目内模板定制丢失</text><text class="s" x="905" y="606">2. 模板章节/no-hash/字段白名单变化 → hash 输入变化</text><text class="s" x="905" y="641">3. 已 approve 文档可能全部出现 hash 偏离</text><text class="s" x="905" y="676">4. 需要人工按新模板修文档并重新 approve</text><text class="s" x="905" y="711">5. config.type 中途改变也没有迁移路径</text><text class="s" x="905" y="746">因此 refresh 是母版发布动作，不是普通日常命令</text>
  <path class="overwrite" d="M1237 390V485"/>
  <text class="s" x="55" y="830">安装完成后的正常入口：pipeline-&lt;project&gt; → node blueprint/scripts/bp.mjs stage；母版 blueprint skill 不参与日常推进。</text>
</svg>
