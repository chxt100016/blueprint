<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Blueprint 能力判断分工</title>
  <desc id="desc">商业能力、业务服务、业务活动和领域能力分别由人、AI skill 与 bp 脚本承担什么判断。</desc>
  <defs>
    <style>.bg{fill:#f8fafc}.box{stroke-width:2;rx:16}.human{fill:#fef3c7;stroke:#f59e0b}.ai{fill:#ede9fe;stroke:#8b5cf6}.bp{fill:#dbeafe;stroke:#3b82f6}.good{fill:#dcfce7;stroke:#22c55e}.bad{fill:#ffe4e6;stroke:#f43f5e}.h{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.t{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.s{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.m{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}.arrow{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7;fill:none}</style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1440" height="980"/>
  <text class="h" x="55" y="58">“能力判断”其实分成四层，判断者并不相同</text>
  <text class="s" x="55" y="88">黄色 = 人给定；紫色 = AI skill 做语义判断；蓝色 = bp 做结构与状态判断。</text>

  <rect class="box human" x="55" y="130" width="290" height="195"/>
  <text class="t" x="80" y="170">1. 商业能力</text>
  <text class="s" x="80" y="205">载体：product/&lt;capability&gt;.md</text>
  <text class="s" x="80" y="236">判断者：人</text>
  <text class="s" x="80" y="267">含义：业务归属域，不是复用组件</text>
  <text class="s" x="80" y="298">脚本只按文件名建立 capability id</text>

  <rect class="box human" x="400" y="130" width="290" height="195"/>
  <text class="t" x="425" y="170">2. 业务服务锚点</text>
  <text class="s" x="425" y="205">载体：product 二级标题</text>
  <text class="s" x="425" y="236">判断者：人描述，flow skill 整理</text>
  <text class="s" x="425" y="267">脚本计算 anchor hash</text>
  <text class="s" x="425" y="298">并保证一个锚点只被一个 flow 认领</text>

  <rect class="box ai" x="745" y="130" width="290" height="195"/>
  <text class="t" x="770" y="170">3. 业务活动</text>
  <text class="s" x="770" y="205">判断者：flow skill</text>
  <text class="m" x="770" y="237">写：独立状态变更</text>
  <text class="m" x="770" y="267">查：独立交付对象/统计结果</text>
  <text class="s" x="770" y="298">bp 只校验 slug、目录、引用、环</text>

  <rect class="box ai" x="1090" y="130" width="295" height="195"/>
  <text class="t" x="1115" y="170">4. 领域能力</text>
  <text class="s" x="1115" y="205">发现者：activity skill</text>
  <text class="m" x="1115" y="237">≥ 2 个业务服务复用</text>
  <text class="m" x="1115" y="267">且正确性不依赖调用方上下文</text>
  <text class="s" x="1115" y="298">最终提取：人确认</text>

  <path class="arrow" d="M345 228H395"/><path class="arrow" d="M690 228H740"/><path class="arrow" d="M1035 228H1085"/>

  <rect class="box bp" x="55" y="385" width="640" height="250"/>
  <text class="t" x="80" y="425">bp 能确定地判断什么</text>
  <text class="s" x="80" y="463">• 路径/id 是否匹配；模板章节、front-matter、编号是否合法</text>
  <text class="s" x="80" y="498">• product anchor 是否存在/唯一；活动目录是否与划分一致</text>
  <text class="s" x="80" y="533">• depends_on 是否同服务、是否成环；uses id 格式是否合法</text>
  <text class="s" x="80" y="568">• uses 引用的 domain 文档是否缺失；schema/codemap 文件是否齐全</text>
  <text class="s" x="80" y="603">• 当前内容哈希与 approve/impl 锁是否一致</text>

  <rect class="box bad" x="745" y="385" width="640" height="250"/>
  <text class="t" x="770" y="425">bp 不能确定地判断什么</text>
  <text class="s" x="770" y="463">• product 的商业边界是否合理</text>
  <text class="s" x="770" y="498">• 一个流程步骤是否真的构成独立业务活动</text>
  <text class="s" x="770" y="533">• 领域规则是否真的跨服务复用、是否上下文无关</text>
  <text class="s" x="770" y="568">• 流程图/时序图与文字语义、顺序是否完全一致</text>
  <text class="s" x="770" y="603">• 动作是否完整落到代码、codemap 是否漏列实际修改文件</text>

  <rect class="box good" x="230" y="705" width="980" height="195"/>
  <text class="t" x="260" y="748">正确理解：模型产出候选，脚本验证不变量，人批准不可逆语义</text>
  <text class="s" x="260" y="788">AI skill：从自然语言抽象服务/活动/领域契约，遇到不确定项进入 review。</text>
  <text class="s" x="260" y="824">bp：根据文档事实 + hash + lock 计算 todo/review/approve/done，并守住确认门。</text>
  <text class="s" x="260" y="860">人：提供 product、回答澄清、通过三道 approve，执行带副作用的 todo。</text>
  <path class="dash" d="M720 635V705"/>
  <text class="s" x="55" y="945">关键区别：商业能力 capability 是纵向归属；领域能力 @domain.name 是横切复用。代码中的命名与路径也严格分开。</text>
</svg>
