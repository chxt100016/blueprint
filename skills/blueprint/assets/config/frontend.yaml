project: {{PROJECT}}
type: frontend               # backend | frontend | fullstack

# {capability} 与 {service} 由业务活动 id 的对应段替换,{name} 由领域能力 id 的第二段替换
layout:
  frontend: "{{LAYOUT_FRONTEND}}"
  domain: "{{LAYOUT_DOMAIN}}"

# 全局可读路径,追加到每次 bp scope 的输出末尾
always_readable:
  - src/shared/
  - src/types/

# 按商业能力覆盖 layout
overrides: {}

verify:
  frontend: "{{VERIFY_FRONTEND}}"

db:
  dialect: {{DB_DIALECT}}
  migration_table: {{DB_MIGRATION_TABLE}}

commit:
  type_rules:
    has_new_activity: feat
    only_modified: fix

blueprint_version: "{{VERSION}}"
